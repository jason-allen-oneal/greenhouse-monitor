name: ci

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python syntax check
        run: python -m py_compile receiver/receiver.py receiver/monitor_greenhouse.py esp32/sensor_node_main.py esp32/esp32_i2c_scan.py esp32/mpy_serial_exec.py
      - name: Node syntax check
        run: node --check dashboard/server.js && node --check dashboard/nowcast.js && node --check dashboard/weather_external.js && node --check dashboard/public/app.js
      - name: Sensitive file guard
        run: |
          ! git ls-files | grep -E '(\.env|\.jsonl|\.log|greenhouse-weather\.json|__pycache__|\.pyc|esp32-backups|dashboard-check)'
          ! git grep -n -I -E 'gho_|ghp_|github_pat_|BEGIN .*PRIVATE|OPENAI_API_KEY|AWS_SECRET|SECRET_KEY' -- ':!.github/workflows/ci.yml'
          ! git grep -n -I -E '/home/[[:alnum:]_.-]+|192\\.168\\.[0-9]{1,3}\\.[0-9]{1,3}|GREENHOUSE_LAT=.*[0-9]|GREENHOUSE_LON=.*[0-9]' -- ':!.github/workflows/ci.yml'
